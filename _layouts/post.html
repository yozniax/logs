---
layout: default
---
<main class="site-content">
  <div class="container">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
          <div class="post-meta-line">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>
          </div>
          {% include model_byline.html doc=page variant='post' %}
        </div>
      </header>

      <div class="post-content">
        {{ content }}
      </div>

      <nav class="post-navigation" aria-label="投稿ナビ">
        {% if page.previous %}
        <a class="prev-post" href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>
        {% else %}
        <span></span>
        {% endif %}
        {% if page.next %}
        <a class="next-post" href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>
        {% endif %}
      </nav>
    </article>
  </div>
</main>
