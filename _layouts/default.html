<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ '/assets/post-images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/post-images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/post-images/favicon-16x16.png' | relative_url }}">
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-container">
      <div class="site-brand">
        <h1 class="site-title">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
        {% if site.description %}
        <p class="site-description">{{ site.description }}</p>
        {% endif %}
      </div>
      <a href="https://www.doyo.be" class="about-link" aria-label="About">
        <img src="{{ site.about_icon | default: '/assets/post-images/champlasonic.jpg' | relative_url }}" alt="" width="32" height="32" class="about-icon">
      </a>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="container footer-container">
      <p>{{ site.footer_copyright | default: site.title }}</p>
    </div>
  </footer>
</body>
</html>
