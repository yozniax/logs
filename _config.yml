# 本番: https://briscape.com をルートに表示（サブドメイン不要）。baseurl は空。
# ローカルで /logs 付きプレビューが必要な場合は _config_local.yml で上書きする。
title: "Brilliant Scape"
description: "文豪の文体をお借りして経験と想いと考えを書いています"
url: "https://briscape.com"
baseurl: ""

lang: ja
timezone: Asia/Tokyo
# 未来の date はビルドに出さない。JST の日時を過ぎたら .github/workflows/publish-due-posts.yml が Pages を再ビルドする。
future: false

repository: yozniax/logs

# フッター（© の文言）。未設定時は title のみ表示されます。
footer_copyright: "© 2016–2026 Brilliant Scape. All rights reserved."

# About リンク横のアイコン（ヘッダー）
about_icon: /assets/post-images/champlasonic.jpg

# Google Analytics 4（gtag）。ローカルでは _config_local.yml で google_analytics: "" として無効化可能。
google_analytics: "G-PS43NR10MN"

markdown: kramdown

# 記事 URL（例: /posts/2026/05/03/permalink-sample/）
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

author:
  name: Yo Yoshizaki

# GitHub Pages のカスタムドメイン用（ビルド出力に含める）
include:
  - CNAME

# 投稿の画像は assets/post-images/ に置く（Jekyll は _ で始まるフォルダを出力しません）
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - SUMMARY.md
  - Dockerfile
  - docker-compose.yml
  - vendor
  - scripts
  - .cursor
  - .github
