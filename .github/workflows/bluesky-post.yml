name: Post new articles to Bluesky

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
  schedule:
    # 予約投稿（未来 date）がサイトに載る帯に合わせる
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Skip if Bluesky secrets missing
        id: secrets
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -z "${BLUESKY_IDENTIFIER}" ] || [ -z "${BLUESKY_APP_PASSWORD}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Bluesky secrets not set; skip"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview pending posts
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ruby scripts/bluesky_post.rb self-test
          ruby scripts/bluesky_post.rb pending || true
          ruby scripts/bluesky_post.rb post --dry-run

      - name: Post to Bluesky
        if: steps.secrets.outputs.configured == 'true'
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ruby scripts/bluesky_post.rb post

      - name: Commit posted state
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- _data/bluesky_posted.yml; then
            echo "no state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/bluesky_posted.yml
          git commit -m "Record Bluesky posts"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((i * 2))
          done
          exit 1
