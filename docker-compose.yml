services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    environment:
      - BUNDLE_PATH=/usr/local/bundle
    command: >
      sh -c "bundle check || bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"

volumes:
  bundle:
