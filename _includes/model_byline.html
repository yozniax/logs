{%- assign d = include.doc -%}
{%- if d.tags.first -%}
{%- assign mtag = d.tags | first -%}
{%- assign mslug = site.data.tag_slugs[mtag] -%}
<span class="post-item-model">by {% if mslug %}<a href="{{ '/model/' | append: mslug | append: '/' | relative_url }}" class="post-item-model-link">{{ mtag }}</a>{% else %}{{ mtag }}{% endif %} model</span>
{%- endif -%}
